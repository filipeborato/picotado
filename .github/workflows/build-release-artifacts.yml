name: Build Release Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PICOTADO_VERSION: "0.1.3"

permissions:
  contents: write

jobs:
  build-macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each slice is validated on a NATIVE runner so auval loads the
          # component without Rosetta. Apple Silicon first shipped on macOS 11.
          - name: macOS arm64 Release
            runs_on: macos-15
            architecture: arm64
            arch_label: AppleSilicon
            deployment_target: "11.0"
          # Intel slice on a native Intel runner; 10.15 (Catalina) is a safe min.
          - name: macOS Intel Release
            runs_on: macos-15-intel
            architecture: x86_64
            arch_label: Intel
            deployment_target: "10.15"

    env:
      ARCH: ${{ matrix.architecture }}
      ARCH_LABEL: ${{ matrix.arch_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.architecture }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3
        run: cmake --build build --config Release --target Picotado_VST3 --parallel

      - name: Build AU
        run: cmake --build build --config Release --target Picotado_AU --parallel

      - name: Sign and validate Audio Unit
        shell: bash
        run: |
          set -euo pipefail

          au="build/plugin/Picotado_artefacts/Release/AU/Picotado.component"
          test -d "$au"

          # Ad-hoc sign the component in place so the bundle we validate is the
          # exact one we ship. auval on recent macOS rejects unsigned components.
          codesign --force --deep --sign - "$au"
          codesign --verify --deep --strict --verbose=2 "$au"

          # Install into the per-user Components path so auval can discover it.
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/Picotado.component"
          cp -R "$au" "$components/"

          installed="$components/Picotado.component"

          # Clear quarantine and the AU registration cache so a fresh scan runs.
          xattr -dr com.apple.quarantine "$installed" || true
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          rm -f "$HOME/Library/Caches/AudioUnitCache/com.apple.audiounits.cache" || true

          # Make the validated slice (arm64 / x86_64) obvious in the log.
          file "$installed/Contents/MacOS/"*

          # Best-effort listing of our component; never fails the job.
          auval -a | grep -i Picotado || true

          # Mandatory validation. Codes come from juce_add_plugin():
          # kAudioUnitType_Effect = aufx, PLUGIN_CODE = Pico,
          # PLUGIN_MANUFACTURER_CODE = BoCo. With `set -e`, a non-zero auval
          # exit fails this step and the whole workflow.
          auval -v aufx Pico BoCo

      - name: Validate plugin GUI (pluginval)
        shell: bash
        run: |
          set -euo pipefail

          # Picotado's editor is a JUCE WebView (NEEDS_WEB_BROWSER). pluginval
          # opens/closes the editor and sweeps parameters, which is what surfaces
          # a WebView UI that fails to load on macOS.
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pv="pluginval.app/Contents/MacOS/pluginval"
          chmod +x "$pv"

          au="build/plugin/Picotado_artefacts/Release/AU/Picotado.component"
          vst3="build/plugin/Picotado_artefacts/Release/VST3/Picotado.vst3"

          "$pv" --strictness-level 5 --timeout-ms 120000 --validate "$au"
          "$pv" --strictness-level 5 --timeout-ms 120000 --validate "$vst3"

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/Picotado_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Picotado.vst3"
          au="$artifact_root/AU/Picotado.component"

          test -d "$vst3"
          test -d "$au"

          base="Picotado-v${PICOTADO_VERSION}-macOS-${ARCH_LABEL}"

          # The AU is zipped from the same bundle that was signed and validated.
          ditto -c -k --keepParent "$vst3" "$dist/${base}-VST3.zip"
          ditto -c -k --keepParent "$au" "$dist/${base}-AU.zip"

          cat > "$dist/INSTALL-macOS-${ARCH_LABEL}.md" <<EOF
          # Picotado macOS install (${ARCH_LABEL} / ${ARCH})

          The Audio Unit is ad-hoc signed and was validated in CI with
          \`auval -v aufx Pico BoCo\`. The VST3 is an unsigned development build.

          ## VST3

          Unzip ${base}-VST3.zip and copy Picotado.vst3 to:

              ~/Library/Audio/Plug-Ins/VST3/

          ## AU

          Unzip ${base}-AU.zip and copy Picotado.component to:

              ~/Library/Audio/Plug-Ins/Components/

          ## Gatekeeper note

          If macOS blocks the unsigned VST3, remove quarantine after unzipping:

              xattr -dr com.apple.quarantine Picotado.vst3
              xattr -dr com.apple.quarantine Picotado.component
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-install-notes
          path: dist/INSTALL-macOS-${{ matrix.arch_label }}.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3.zip
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU.zip
            dist/INSTALL-macOS-${{ matrix.arch_label }}.md

  build-linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package artifacts
        run: |
          chmod +x scripts/release-linux.sh scripts/install-vst3-linux.sh scripts/install-lv2-linux.sh
          scripts/release-linux.sh --install-deps

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
          if-no-files-found: error

      - name: Upload LV2
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-install-notes
          path: dist/INSTALL-Linux.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
            dist/INSTALL-Linux.md
