name: Build Release Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PICOTADO_VERSION: "0.1.0"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3
        run: cmake --build build --config Release --target Picotado_VST3 --parallel

      - name: Build AU
        run: cmake --build build --config Release --target Picotado_AU --parallel

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/Picotado_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Picotado.vst3"
          au="$artifact_root/AU/Picotado.component"

          test -d "$vst3"
          test -d "$au"

          ditto -c -k --keepParent "$vst3" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-VST3.zip"
          ditto -c -k --keepParent "$au" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-AU.zip"

          cat > "$dist/INSTALL-macOS.md" <<'EOF'
          # Picotado macOS install

          These artifacts are unsigned development builds.

          ## VST3

          Unzip `Picotado-v0.1.0-macOS-VST3.zip` and copy `Picotado.vst3` to:

          ```text
          ~/Library/Audio/Plug-Ins/VST3/
          ```

          ## AU

          Unzip `Picotado-v0.1.0-macOS-AU.zip` and copy `Picotado.component` to:

          ```text
          ~/Library/Audio/Plug-Ins/Components/
          ```

          ## Gatekeeper note

          Because these builds are not notarized, macOS may block them the first time. If needed, remove quarantine after unzipping:

          ```bash
          xattr -dr com.apple.quarantine Picotado.vst3
          xattr -dr com.apple.quarantine Picotado.component
          ```
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-macOS-VST3
          path: dist/Picotado-v0.1.0-macOS-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-macOS-AU
          path: dist/Picotado-v0.1.0-macOS-AU.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-macOS-install-notes
          path: dist/INSTALL-macOS.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-macOS-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v0.1.0-macOS-VST3.zip
            dist/Picotado-v0.1.0-macOS-AU.zip
            dist/INSTALL-macOS.md

  build-ubuntu:
    name: Ubuntu Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --target Picotado_VST3 --parallel

      - name: Build LV2
        run: cmake --build build --target Picotado_LV2 --parallel

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/Picotado_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Picotado.vst3"
          lv2="$artifact_root/LV2/Picotado.lv2"

          test -d "$vst3"
          test -d "$lv2"

          tar -czf "$dist/Picotado-v${PICOTADO_VERSION}-Ubuntu-VST3.tar.gz" -C "$artifact_root/VST3" "Picotado.vst3"
          tar -czf "$dist/Picotado-v${PICOTADO_VERSION}-Ubuntu-LV2.tar.gz" -C "$artifact_root/LV2" "Picotado.lv2"

          cat > "$dist/INSTALL-Ubuntu.md" <<'EOF'
          # Picotado Ubuntu install

          These artifacts are unsigned development builds.

          ## VST3

          Extract `Picotado-v0.1.0-Ubuntu-VST3.tar.gz` and copy `Picotado.vst3` to:

          ```text
          ~/.vst3/
          ```

          Example:

          ```bash
          mkdir -p ~/.vst3
          tar -xzf Picotado-v0.1.0-Ubuntu-VST3.tar.gz
          cp -R Picotado.vst3 ~/.vst3/
          ```

          Then rescan plugins in your DAW.

          ## LV2

          Extract `Picotado-v0.1.0-Ubuntu-LV2.tar.gz` and copy `Picotado.lv2` to:

          ```text
          ~/.lv2/
          ```

          Example:

          ```bash
          mkdir -p ~/.lv2
          tar -xzf Picotado-v0.1.0-Ubuntu-LV2.tar.gz
          cp -R Picotado.lv2 ~/.lv2/
          ```

          Then rescan plugins in your DAW.
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-Ubuntu-VST3
          path: dist/Picotado-v0.1.0-Ubuntu-VST3.tar.gz
          if-no-files-found: error

      - name: Upload LV2
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-Ubuntu-LV2
          path: dist/Picotado-v0.1.0-Ubuntu-LV2.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-Ubuntu-install-notes
          path: dist/INSTALL-Ubuntu.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v0.1.0-Ubuntu-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v0.1.0-Ubuntu-VST3.tar.gz
            dist/Picotado-v0.1.0-Ubuntu-LV2.tar.gz
            dist/INSTALL-Ubuntu.md
