name: Build Release Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PICOTADO_VERSION: "0.1.2"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3
        run: cmake --build build --config Release --target Picotado_VST3 --parallel

      - name: Build AU
        run: cmake --build build --config Release --target Picotado_AU --parallel

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/Picotado_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Picotado.vst3"
          au="$artifact_root/AU/Picotado.component"

          test -d "$vst3"
          test -d "$au"

          ditto -c -k --keepParent "$vst3" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-VST3.zip"
          ditto -c -k --keepParent "$au" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-AU.zip"

          cat > "$dist/INSTALL-macOS.md" <<EOF
          # Picotado macOS install

          These artifacts are unsigned development builds.

          ## VST3

          Unzip Picotado-v${PICOTADO_VERSION}-macOS-VST3.zip and copy Picotado.vst3 to:

              ~/Library/Audio/Plug-Ins/VST3/

          ## AU

          Unzip Picotado-v${PICOTADO_VERSION}-macOS-AU.zip and copy Picotado.component to:

              ~/Library/Audio/Plug-Ins/Components/

          ## Gatekeeper note

          Because these builds are not notarized, macOS may block them the first time. If needed, remove quarantine after unzipping:

              xattr -dr com.apple.quarantine Picotado.vst3
              xattr -dr com.apple.quarantine Picotado.component
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-AU
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-AU.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-install-notes
          path: dist/INSTALL-macOS.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-VST3.zip
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-AU.zip
            dist/INSTALL-macOS.md

  build-linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package artifacts
        run: |
          chmod +x scripts/release-linux.sh scripts/install-vst3-linux.sh scripts/install-lv2-linux.sh
          scripts/release-linux.sh --install-deps

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
          if-no-files-found: error

      - name: Upload LV2
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-install-notes
          path: dist/INSTALL-Linux.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
            dist/INSTALL-Linux.md
