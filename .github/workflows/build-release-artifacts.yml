name: Build Release Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PICOTADO_VERSION: "0.1.2"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Release (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel binaries are cross-compiled on the Apple Silicon runner
          # (the macOS SDK ships both slices), avoiding the scarce/queued
          # macos-13 Intel runners.
          - runner: macos-14
            arch: x86_64
            arch_label: Intel
          - runner: macos-14
            arch: arm64
            arch_label: AppleSilicon

    env:
      ARCH: ${{ matrix.arch }}
      ARCH_LABEL: ${{ matrix.arch_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build VST3
        run: cmake --build build --config Release --target Picotado_VST3 --parallel

      - name: Build AU
        run: cmake --build build --config Release --target Picotado_AU --parallel

      - name: Validate AU (auval)
        shell: bash
        # The x86_64 slice is cross-compiled and can only be loaded through
        # Rosetta on the Apple Silicon runner, so it is best-effort; the native
        # arm64 leg is the hard gate that fails the build on a bad AU.
        continue-on-error: ${{ matrix.arch == 'x86_64' }}
        run: |
          set -euo pipefail

          comp="build/plugin/Picotado_artefacts/Release/AU/Picotado.component"
          test -d "$comp"

          # auval only validates units it can find in the AU search paths.
          dest="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$dest"
          rm -rf "$dest/Picotado.component"
          cp -R "$comp" "$dest/"

          # Force the Audio Component registry to pick up the new unit.
          killall -9 AudioComponentRegistrar 2>/dev/null || true

          # Use the validator matching the built slice (x86_64 via Rosetta).
          if [ "$ARCH" = "x86_64" ]; then
            auval=(arch -x86_64 auval)
          else
            auval=(auval)
          fi

          echo "Registered Picotado audio units:"
          "${auval[@]}" -a | grep -iE 'picotado|Bort' || true

          # Codes come from juce_add_plugin(): kAudioUnitType_Effect = aufx,
          # PLUGIN_CODE = Pcto, PLUGIN_MANUFACTURER_CODE = Bort.
          echo "Validating AU aufx Pcto Bort ($ARCH)"
          "${auval[@]}" -v aufx Pcto Bort

      - name: Validate plugin (pluginval)
        shell: bash
        # pluginval opens/closes the editor and sweeps parameters; for a
        # WebView (WebBrowserComponent) UI this is what catches a GUI that
        # fails to load on macOS. Hard gate on arm64, best-effort on x86_64.
        continue-on-error: ${{ matrix.arch == 'x86_64' }}
        run: |
          set -euo pipefail

          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pv="pluginval.app/Contents/MacOS/pluginval"
          chmod +x "$pv"

          au="build/plugin/Picotado_artefacts/Release/AU/Picotado.component"
          vst3="build/plugin/Picotado_artefacts/Release/VST3/Picotado.vst3"

          runner=("$pv" --strictness-level 5 --timeout-ms 120000 --validate)
          if [ "$ARCH" = "x86_64" ]; then
            runner=(arch -x86_64 "${runner[@]}")
          fi

          echo "pluginval AU ($ARCH)"
          "${runner[@]}" "$au"
          echo "pluginval VST3 ($ARCH)"
          "${runner[@]}" "$vst3"

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="build/plugin/Picotado_artefacts/Release"
          dist="dist"
          mkdir -p "$dist"

          vst3="$artifact_root/VST3/Picotado.vst3"
          au="$artifact_root/AU/Picotado.component"

          test -d "$vst3"
          test -d "$au"

          ditto -c -k --keepParent "$vst3" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-${ARCH_LABEL}-VST3.zip"
          ditto -c -k --keepParent "$au" "$dist/Picotado-v${PICOTADO_VERSION}-macOS-${ARCH_LABEL}-AU.zip"

          cat > "$dist/INSTALL-macOS-${ARCH_LABEL}.md" <<EOF
          # Picotado macOS install (${ARCH_LABEL} / ${ARCH})

          These artifacts are unsigned development builds for the ${ARCH} architecture.

          ## VST3

          Unzip Picotado-v${PICOTADO_VERSION}-macOS-${ARCH_LABEL}-VST3.zip and copy Picotado.vst3 to:

              ~/Library/Audio/Plug-Ins/VST3/

          ## AU

          Unzip Picotado-v${PICOTADO_VERSION}-macOS-${ARCH_LABEL}-AU.zip and copy Picotado.component to:

              ~/Library/Audio/Plug-Ins/Components/

          ## Gatekeeper note

          Because these builds are not notarized, macOS may block them the first time. If needed, remove quarantine after unzipping:

              xattr -dr com.apple.quarantine Picotado.vst3
              xattr -dr com.apple.quarantine Picotado.component
          EOF

          ls -la "$dist"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3.zip
          if-no-files-found: error

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU.zip
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-install-notes
          path: dist/INSTALL-macOS-${{ matrix.arch_label }}.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-VST3.zip
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-macOS-${{ matrix.arch_label }}-AU.zip
            dist/INSTALL-macOS-${{ matrix.arch_label }}.md

  build-linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PICOTADO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and package artifacts
        run: |
          chmod +x scripts/release-linux.sh scripts/install-vst3-linux.sh scripts/install-lv2-linux.sh
          scripts/release-linux.sh --install-deps

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
          if-no-files-found: error

      - name: Upload LV2
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2
          path: dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
          if-no-files-found: error

      - name: Upload install notes
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-install-notes
          path: dist/INSTALL-Linux.md
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picotado-v${{ env.PICOTADO_VERSION }}-Linux-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-VST3.tar.gz
            dist/Picotado-v${{ env.PICOTADO_VERSION }}-Linux-LV2.tar.gz
            dist/INSTALL-Linux.md
